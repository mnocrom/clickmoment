<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Undangan Pernikahan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #24402b;
        --cream: #fff9ec;
        --sand: #f2e3b3;
        --leaf: #4e9f5b;
        --red: #e5604d;
        --muted: #5f7a63;
        --f: "Nunito", system-ui, sans-serif;
        --h: "Fredoka", "Nunito", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #9ad3e3;
        color: var(--ink);
        font: 400 16px/1.55 var(--f);
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font-family: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 2px;
      }
      h1,
      h2,
      h3 {
        font-family: var(--h);
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: pointer;
      }
      .btn {
        display: inline-block;
        border: 0;
        background: var(--ink);
        color: var(--cream);
        font: 600 15px var(--f);
        padding: 12px 26px;
        border-radius: 99px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 0 #0f2314;
      }
      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #0f2314;
      }
      .btn.line {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--ink);
        box-shadow: none;
      }
      /* loading + cover */
      #load {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #cfebc6;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: opacity 0.5s;
      }
      #load.done {
        opacity: 0;
        pointer-events: none;
      }
      #load b {
        font: 600 22px var(--h);
      }
      .bar {
        width: 200px;
        height: 12px;
        background: #fff;
        border-radius: 9px;
        margin: 14px auto 6px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--leaf);
      }
      #cover {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(180deg, #bfe6f0, #ddf2d2 70%, #9bd08a);
        transition: opacity 0.7s;
      }
      #cover.open {
        opacity: 0;
        pointer-events: none;
      }
      #cover .in {
        max-width: 340px;
        text-align: center;
      }
      #cover small {
        display: block;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--muted);
      }
      #cover h1 {
        font-size: clamp(46px, 14vw, 62px);
        line-height: 1;
        margin: 10px 0 18px;
      }
      .guest {
        background: #fff;
        border-radius: 18px;
        padding: 12px 24px;
        margin: 0 auto 20px;
        box-shadow: 0 5px 0 rgba(36, 64, 43, 0.15);
      }
      .guest small {
        letter-spacing: 0;
        text-transform: none;
        font-size: 13px;
      }
      .guest b {
        display: block;
        font: 600 21px var(--h);
      }
      /* ui */
      #ui[hidden] {
        display: none;
      }
      #top {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: var(--cream);
        border-radius: 99px;
        padding: 6px 20px;
        font: 600 17px var(--h);
        box-shadow: 0 4px 0 rgba(36, 64, 43, 0.2);
        white-space: nowrap;
      }
      #hint {
        position: fixed;
        top: calc(62px + env(safe-area-inset-top));
        left: 0;
        right: 0;
        text-align: center;
        z-index: 9;
        font-weight: 700;
        font-size: 14px;
        color: var(--ink);
        text-shadow: 0 1px 0 #fff;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #menu {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 10;
        display: flex;
        gap: 4px;
        background: rgba(255, 249, 236, 0.95);
        border-radius: 20px;
        padding: 6px;
        box-shadow: 0 5px 0 rgba(36, 64, 43, 0.2);
        max-width: 520px;
        margin: 0 auto;
      }
      #menu button {
        flex: 1;
        border: 0;
        background: none;
        border-radius: 14px;
        padding: 6px 2px;
        font: 700 11px var(--f);
        color: var(--ink);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-height: 52px;
      }
      #menu button span {
        font-size: 20px;
        line-height: 1;
      }
      #menu button:active,
      #menu button.on {
        background: var(--sand);
      }
      .bd {
        position: fixed;
        inset: 0;
        z-index: 19;
        background: rgba(15, 35, 20, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .bd.on {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 0;
        width: 100%;
        max-width: 540px;
        max-height: 84vh;
        overflow: auto;
        background: var(--cream);
        border-radius: 26px 26px 0 0;
        padding: 20px 20px calc(30px + env(safe-area-inset-bottom));
        transform: translate(-50%, 105%);
        transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        text-align: center;
      }
      .sheet.on {
        transform: translate(-50%, 0);
      }
      .sh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .sh h2 {
        font-size: 26px;
      }
      #x {
        border: 0;
        background: var(--sand);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        color: var(--ink);
      }
      .pn {
        display: none;
      }
      .pn.on {
        display: block;
      }
      #hNames {
        font-size: 44px;
        line-height: 1.02;
        margin: 4px 0 8px;
      }
      .amp {
        font-size: 0.55em;
        color: var(--red);
      }
      .cd {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 16px 0 20px;
      }
      .cd div {
        background: var(--sand);
        border-radius: 14px;
        padding: 10px 0;
      }
      .cd b {
        display: block;
        font: 600 26px/1 var(--h);
      }
      .cd span {
        font-size: 12px;
        color: var(--muted);
      }
      .ev {
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 10px;
        box-shadow: 0 3px 0 rgba(36, 64, 43, 0.12);
      }
      .ev h3 {
        font-size: 22px;
        color: var(--leaf);
      }
      .ev p {
        margin: 0;
      }
      .photo {
        width: 130px;
        height: 130px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: linear-gradient(160deg, #cfebc6, #9bd08a);
        border: 4px solid #fff;
        box-shadow: 0 4px 0 rgba(36, 64, 43, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 46px var(--h);
      }
      .person {
        margin-bottom: 22px;
      }
      .person h3 {
        font-size: 24px;
      }
      .gal {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }
      .gal div {
        aspect-ratio: 1;
        border-radius: 14px;
        background: linear-gradient(160deg, #cfebc6, #f2e3b3);
      }
      label {
        display: block;
        text-align: left;
        font-weight: 700;
        font-size: 14px;
        margin: 12px 0 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
        padding: 11px 12px;
        border: 2px solid #d8e5cf;
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
      }
      .bank {
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 10px;
      }
      .bank b {
        display: block;
        font: 600 24px var(--h);
        letter-spacing: 0.05em;
      }
      #music {
        position: fixed;
        right: 14px;
        top: calc(12px + env(safe-area-inset-top));
        z-index: 11;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 0;
        background: var(--cream);
        font-size: 18px;
        cursor: pointer;
        display: none;
        box-shadow: 0 3px 0 rgba(36, 64, 43, 0.2);
      }
      #music.on {
        animation: sp 6s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .pulse {
        animation: pu 1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pu {
        50% {
          transform: scale(1.5);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
        .pulse,
        #music.on {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="load">
      <div>
        <b>Memuat desa…</b>
        <div class="bar"><i id="lb"></i></div>
        <span id="lp">0%</span>
      </div>
    </div>

    <div id="cover">
      <div class="in">
        <small>Undangan Pernikahan</small>
        <h1 id="cNames"></h1>
        <div class="guest">
          <small>Kepada Yth.</small><b id="guest">Tamu Undangan</b>
        </div>
        <button class="btn" id="openBtn">Buka Undangan</button>
      </div>
    </div>

    <svg
      id="map"
      role="img"
      aria-label="Peta desa. Ketuk bangunan atau gunakan menu di bawah."
    >
      <g id="world"></g>
    </svg>
    <button id="music" aria-label="Putar atau jeda musik">♪</button>
    <audio id="audio" loop></audio>

    <div id="ui" hidden>
      <div id="top"></div>
      <p id="hint">Ketuk bangunan atau pakai menu di bawah</p>
      <nav id="menu" aria-label="Menu undangan">
        <button data-g="undangan"><span>💌</span>Undangan</button>
        <button data-g="rsvp"><span>✅</span>RSVP</button>
        <button data-g="profil"><span>💑</span>Profil</button>
        <button data-g="gift"><span>🎁</span>Gift</button>
        <button data-g="ucapan"><span>✉️</span>Ucapan</button>
      </nav>
    </div>

    <div class="bd" id="bd"></div>
    <div
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="st"
    >
      <div class="sh">
        <h2 id="st"></h2>
        <button id="x" aria-label="Tutup">×</button>
      </div>

      <div class="pn" id="p-undangan">
        <p class="muted">Kami akan menikah</p>
        <h1 id="hNames"></h1>
        <p id="hDate" style="font-weight: 700"></p>
        <div class="cd" id="cd"></div>
        <p class="muted" id="pembuka"></p>
        <div id="events"></div>
        <p id="loc" style="margin-top: 14px"></p>
        <a class="btn line" id="mapBtn" target="_blank" rel="noopener"
          >Buka peta lokasi</a
        >
        <p class="muted" style="margin: 18px 0 0">
          Sampai jumpa! <span id="fNames"></span>
        </p>
      </div>

      <div class="pn" id="p-rsvp">
        <label for="rn">Nama</label><input id="rn" />
        <label for="rj">Jumlah tamu</label>
        <select id="rj">
          <option>1 orang</option>
          <option>2 orang</option>
          <option>3 orang</option>
          <option>4 orang</option>
        </select>
        <label for="rs">Kehadiran</label>
        <select id="rs">
          <option>Hadir</option>
          <option>Tidak hadir</option>
        </select>
        <label for="rp">Ucapan</label><textarea id="rp" rows="3"></textarea>
        <p style="margin-top: 16px">
          <button class="btn" id="rsvp">Kirim lewat WhatsApp</button>
        </p>
      </div>

      <div class="pn" id="p-profil">
        <div id="couple"></div>
        <div class="gal" id="gal"></div>
      </div>

      <div class="pn" id="p-gift">
        <div id="bankSec">
          <p class="muted">
            Doa restu Anda sudah sangat berarti. Bila ingin memberi tanda kasih,
            dapat melalui:
          </p>
          <div id="banks"></div>
        </div>
      </div>

      <div class="pn" id="p-ucapan">
        <p class="muted">Tulis ucapan dan doa untuk kedua mempelai.</p>
        <label for="uc">Ucapan</label><textarea id="uc" rows="5"></textarea>
        <p style="margin-top: 16px">
          <button class="btn" id="kirimUc">Kirim lewat WhatsApp</button>
        </p>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const N = 10,
        TW = 64,
        TH = 32,
        NS = "http://www.w3.org/2000/svg";
      const P = (x, y, z = 0) => [((x - y) * TW) / 2, ((x + y) * TH) / 2 - z];
      const pts = (a) => a.map((p) => p.join(",")).join(" ");
      const sh = (h, f) =>
        "#" +
        [1, 3, 5]
          .map((i) =>
            Math.min(255, Math.round(parseInt(h.substr(i, 2), 16) * f))
              .toString(16)
              .padStart(2, "0"),
          )
          .join("");
      const el = (t, a, p) => {
        const e = document.createElementNS(NS, t);
        for (const k in a) e.setAttribute(k, a[k]);
        (p || W).appendChild(e);
        return e;
      };
      const svg = $("map"),
        W = $("world");

      /* ===== gambar desa (semua dibuat lewat kode) ===== */
      const G = el("g"),
        E = el("g");
      el(
        "polygon",
        {
          points: pts([P(0, N), P(N, N), P(N, N, -16), P(0, N, -16)]),
          fill: "#B58B55",
        },
        G,
      );
      el(
        "polygon",
        {
          points: pts([P(N, 0), P(N, N), P(N, N, -16), P(N, 0, -16)]),
          fill: "#9C7440",
        },
        G,
      );
      for (let x = 0; x < N; x++)
        for (let y = 0; y < N; y++) {
          const path = (x == 4 && y >= 2) || (y == 6 && x >= 1 && x <= 8);
          el(
            "polygon",
            {
              points: pts([P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)]),
              fill: path ? "#F2E3B3" : (x + y) % 2 ? "#9BD08A" : "#92C982",
            },
            G,
          );
        }
      const ents = [];
      const add = (g, x, y) => {
        E.appendChild(g);
        const o = { g, d: x + y };
        ents.push(o);
        return o;
      };
      const box = (g, x0, y0, x1, y1, z0, z1, c) => {
        el(
          "polygon",
          {
            points: pts([
              P(x1, y0, z0),
              P(x1, y1, z0),
              P(x1, y1, z1),
              P(x1, y0, z1),
            ]),
            fill: sh(c, 0.8),
          },
          g,
        );
        el(
          "polygon",
          {
            points: pts([
              P(x0, y1, z0),
              P(x1, y1, z0),
              P(x1, y1, z1),
              P(x0, y1, z1),
            ]),
            fill: sh(c, 0.92),
          },
          g,
        );
        el(
          "polygon",
          {
            points: pts([
              P(x0, y0, z1),
              P(x1, y0, z1),
              P(x1, y1, z1),
              P(x0, y1, z1),
            ]),
            fill: c,
          },
          g,
        );
      };
      const roof = (g, x0, y0, x1, y1, z, hh, c, o = 0.3) => {
        const a = P((x0 + x1) / 2, (y0 + y1) / 2, z + hh);
        x0 -= o;
        y0 -= o;
        x1 += o;
        y1 += o;
        el(
          "polygon",
          { points: pts([P(x1, y0, z), P(x1, y1, z), a]), fill: sh(c, 0.8) },
          g,
        );
        el(
          "polygon",
          { points: pts([P(x0, y1, z), P(x1, y1, z), a]), fill: sh(c, 0.95) },
          g,
        );
      };
      const objs = {};
      function mk(id, label, door, ax, ay, lz, draw) {
        const g = el("g", { "data-o": id }, E);
        draw(g);
        const [lx, ly] = P(ax, ay, lz),
          w = label.length * 7 + 18;
        el(
          "rect",
          {
            x: lx - w / 2,
            y: ly - 22,
            width: w,
            height: 22,
            rx: 11,
            fill: "#fff",
          },
          g,
        );
        const t = el(
          "text",
          {
            x: lx,
            y: ly - 7,
            "text-anchor": "middle",
            "font-size": 12,
            "font-weight": 700,
            fill: "#24402B",
            "font-family": "Nunito,sans-serif",
          },
          g,
        );
        t.textContent = label;
        const dot = el(
          "circle",
          {
            cx: lx + w / 2 - 2,
            cy: ly - 22,
            r: 6,
            fill: "#E5604D",
            class: "pulse",
          },
          g,
        );
        ents.push({ g, d: ax + ay });
        E.appendChild(g);
        objs[id] = { door, dot };
      }
      mk("undangan", "Undangan", [5, 3.4], 5, 1.8, 54, (g) => {
        box(g, 3.8, 0.8, 6.2, 2.8, 0, 6, "#F4C7B8");
        [
          [3.9, 0.9],
          [5.95, 0.9],
          [3.9, 2.55],
          [5.95, 2.55],
        ].forEach(([x, y]) =>
          box(g, x, y, x + 0.25, y + 0.25, 6, 28, "#C98A6B"),
        );
        roof(g, 3.8, 0.8, 6.2, 2.8, 28, 16, "#D9694A", 0.35);
      });
      mk("profil", "Profil & Cerita", [2, 5.8], 2, 4, 52, (g) => {
        box(g, 1, 3, 3, 5, 0, 22, "#FFF1D6");
        box(g, 1.7, 5, 2.3, 5.01, 0, 12, "#8A5A3C");
        roof(g, 1, 3, 3, 5, 22, 16, "#D9694A", 0.35);
      });
      mk("rsvp", "RSVP", [7.7, 5.5], 7.7, 4.3, 36, (g) => {
        box(g, 7, 3.8, 8.4, 4.8, 0, 9, "#E8C28A");
        box(g, 7.1, 3.9, 8.3, 4.1, 9, 24, "#FFF1D6");
      });
      mk("gift", "Gift", [7, 9.1], 7, 7.8, 26, (g) => {
        box(g, 6.4, 7.2, 7.6, 8.4, 0, 10, "#E56B6F");
        box(g, 6.9, 7.2, 7.1, 8.4, 0, 10.5, "#FFD166");
      });
      mk("ucapan", "Kirim Ucapan", [2.5, 8.8], 2.5, 7.7, 44, (g) => {
        box(g, 2.45, 7.6, 2.65, 7.8, 0, 16, "#8A5A3C");
        box(g, 2.2, 7.45, 2.9, 7.95, 16, 26, "#4C8BF5");
      });
      [
        [2.8, 1.6],
        [0.8, 1.2],
        [9.2, 1.5],
        [0.7, 6.8],
        [9.2, 8.6],
        [1.2, 9.2],
        [4.6, 9.3],
        [8.2, 1.4],
      ].forEach(([x, y]) => {
        const g = el("g", {}, E);
        const [px, py] = P(x, y);
        el(
          "ellipse",
          { cx: px, cy: py, rx: 14, ry: 6, fill: "rgba(0,0,0,.12)" },
          g,
        );
        box(g, x - 0.12, y - 0.12, x + 0.12, y + 0.12, 0, 16, "#8A5A3C");
        const [cx, cy] = P(x, y, 30);
        el("circle", { cx, cy, r: 17, fill: "#4E9F5B" }, g);
        el("circle", { cx: cx - 5, cy: cy - 5, r: 10, fill: "#63B56D" }, g);
        add(g, x, y);
      });
      // ayam
      const hens = [
        [3, 8],
        [6.5, 6.5],
        [5.5, 4.5],
      ].map(([x, y]) => {
        const g = el("g", {}, E);
        el(
          "ellipse",
          { cx: 0, cy: 2, rx: 8, ry: 3, fill: "rgba(0,0,0,.15)" },
          g,
        );
        el("ellipse", { cx: 0, cy: -6, rx: 7, ry: 6, fill: "#fff" }, g);
        el("circle", { cx: 6, cy: -12, r: 4, fill: "#fff" }, g);
        el("path", { d: "M5 -16l2 -3 2 3z", fill: "#E5604D" }, g);
        el("path", { d: "M10 -12l4 1.5-4 1z", fill: "#F2A33A" }, g);
        const o = add(g, x, y);
        Object.assign(o, { x, y, tx: x, ty: y, w: 0 });
        return o;
      });
      // pemain
      const me = el("g", {}, E),
        pl = el("g", {}, me);
      el(
        "ellipse",
        { cx: 0, cy: 2, rx: 10, ry: 4, fill: "rgba(0,0,0,.18)" },
        me,
      );
      el(
        "rect",
        { x: -6, y: -8, width: 5, height: 10, rx: 2, fill: "#3B5B8C" },
        pl,
      );
      el(
        "rect",
        { x: 1, y: -8, width: 5, height: 10, rx: 2, fill: "#3B5B8C" },
        pl,
      );
      el(
        "rect",
        { x: -8, y: -24, width: 16, height: 18, rx: 6, fill: "#E5604D" },
        pl,
      );
      el("circle", { cx: 0, cy: -30, r: 8, fill: "#F2C9A0" }, pl);
      el("path", { d: "M-9 -31a9 9 0 0 1 18 0z", fill: "#4A2E1F" }, pl);
      const player = { x: 5, y: 6.4, goal: null, o: add(me, 5, 6.4), dir: 1 };

      /* ===== loop: jalan, ayam, kamera ===== */
      let camx = 0,
        camy = 0,
        last = 0,
        tx = 0,
        ty = 0,
        started = false;
      const [sx0, sy0] = P(player.x, player.y);
      camx = sx0;
      camy = sy0;
      function tick(t) {
        const dt = Math.min(0.05, (t - last) / 1000 || 0);
        last = t;
        const vw = svg.clientWidth,
          vh = svg.clientHeight;
        let walking = false;
        const g = player.goal;
        if (g) {
          const dx = g.x - player.x,
            dy = g.y - player.y,
            sp = 3.4 * dt;
          if (Math.abs(dx) > 0.06) {
            player.x += Math.sign(dx) * Math.min(sp, Math.abs(dx));
            player.dir = Math.sign(dx);
            walking = true;
          } else if (Math.abs(dy) > 0.06) {
            player.y += Math.sign(dy) * Math.min(sp, Math.abs(dy));
            player.dir = -Math.sign(dy);
            walking = true;
          } else {
            player.goal = null;
            if (g.o) openSheet(g.o);
          }
        }
        hens.forEach((h) => {
          if (h.w > 0) h.w -= dt;
          else if (Math.hypot(h.tx - h.x, h.ty - h.y) < 0.1) {
            h.w = 1 + Math.random() * 3;
            h.tx = Math.max(0.6, Math.min(9.4, h.x + Math.random() * 3 - 1.5));
            h.ty = Math.max(5.1, Math.min(9.4, h.y + Math.random() * 3 - 1.5));
          } else {
            const a = Math.atan2(h.ty - h.y, h.tx - h.x);
            h.x += Math.cos(a) * 0.7 * dt;
            h.y += Math.sin(a) * 0.7 * dt;
          }
          h.d = h.x + h.y;
          const [px, py] = P(h.x, h.y);
          h.g.setAttribute("transform", `translate(${px},${py})`);
        });
        const [px, py] = P(player.x, player.y);
        me.setAttribute("transform", `translate(${px},${py})`);
        pl.setAttribute(
          "transform",
          `translate(0,${walking ? -Math.abs(Math.sin(t / 90)) * 3 : 0}) scale(${player.dir},1)`,
        );
        player.o.d = player.x + player.y;
        camx += (px - camx) * Math.min(1, dt * 4);
        camy += (py - camy) * Math.min(1, dt * 4);
        tx = vw / 2 - camx;
        ty = vh * 0.48 - camy;
        W.setAttribute("transform", `translate(${tx},${ty})`);
        ents
          .slice()
          .sort((a, b) => a.d - b.d)
          .forEach((o) => E.appendChild(o.g));
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      /* ===== interaksi ===== */
      const hide = () => {
        $("hint").style.opacity = 0;
      };
      function go(id) {
        const o = objs[id];
        hide();
        closeSheet();
        player.goal = { x: o.door[0], y: o.door[1], o: id };
      }
      svg.addEventListener("pointerdown", (e) => {
        if (!started) return;
        const o = e.target.closest("[data-o]");
        if (o) return go(o.dataset.o);
        const r = svg.getBoundingClientRect(),
          sx = e.clientX - r.left - tx,
          sy = e.clientY - r.top - ty;
        hide();
        player.goal = {
          x: Math.max(
            0.4,
            Math.min(N - 0.4, (sx / (TW / 2) + sy / (TH / 2)) / 2),
          ),
          y: Math.max(
            0.4,
            Math.min(N - 0.4, (sy / (TH / 2) - sx / (TW / 2)) / 2),
          ),
          o: null,
        };
      });
      document
        .querySelectorAll("#menu button")
        .forEach((b) => (b.onclick = () => go(b.dataset.g)));
      const TITLES = {
        undangan: "Undangan",
        rsvp: "Konfirmasi Kehadiran",
        profil: "Profil & Cerita",
        gift: "Gift",
        ucapan: "Kirim Ucapan",
      };
      function openSheet(id) {
        document
          .querySelectorAll(".pn")
          .forEach((p) => p.classList.toggle("on", p.id === "p-" + id));
        document
          .querySelectorAll("#menu button")
          .forEach((b) => b.classList.toggle("on", b.dataset.g === id));
        $("st").textContent = TITLES[id];
        $("sheet").scrollTop = 0;
        $("sheet").classList.add("on");
        $("bd").classList.add("on");
        objs[id].dot.style.display = "none";
      }
      function closeSheet() {
        $("sheet").classList.remove("on");
        $("bd").classList.remove("on");
        document
          .querySelectorAll("#menu button")
          .forEach((b) => b.classList.remove("on"));
      }
      $("x").onclick = $("bd").onclick = closeSheet;
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSheet();
      });
      $("kirimUc").onclick = () => {
        const t = $("uc").value.trim();
        if (!t) {
          $("uc").focus();
          return;
        }
        open(
          `https://wa.me/${(window.UNDANGAN || {}).wa || ""}?text=${encodeURIComponent("Ucapan dari " + $("guest").textContent + ":\n" + t)}`,
          "_blank",
        );
      };
      $("openBtn").addEventListener("click", () => {
        started = true;
        $("ui").hidden = false;
        $("top").textContent = $("cNames").innerText.replace(/\s*\n\s*/g, " ");
        setTimeout(() => go("undangan"), 900);
      });

      /* loading */
      let pr = 0;
      const li = setInterval(() => {
        pr = Math.min(100, pr + 7 + Math.random() * 9);
        $("lb").style.width = pr + "%";
        $("lp").textContent = Math.round(pr) + "%";
        if (pr >= 100) {
          clearInterval(li);
          setTimeout(() => $("load").classList.add("done"), 250);
        }
      }, 90);
      window.DEFAULT_ID = "arya-kinanti";
    </script>
    <script src="../../assets/undangan.js"></script>
  </body>
</html>
