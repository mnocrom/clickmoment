<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Undangan Pernikahan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fdf4f6;
        --sage: #f9dde3;
        --sage2: #e7a9b8;
        --ink: #6b2d42;
        --muted: #94606f;
        --white: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/1.7 "Plus Jakarta Sans",
          system-ui,
          sans-serif;
        text-align: center;
      }
      body.lock {
        overflow: hidden;
      }
      .serif {
        font-family: "Cormorant Garamond", serif;
      }
      section {
        padding: 72px 24px;
        max-width: 520px;
        margin: 0 auto;
      }
      h2 {
        font:
          700 clamp(26px, 7vw, 36px)/1.1 "Cormorant Garamond",
          serif;
        margin: 0 0 20px;
        overflow-wrap: anywhere;
      }
      p {
        margin: 0 0 14px;
      }
      .muted {
        color: var(--muted);
      }
      .arch {
        border: 1px solid var(--ink);
        outline: 1px solid var(--sage2);
        outline-offset: 6px;
        border-radius: 36px;
        padding: 48px 26px 38px;
        background: rgba(255, 255, 255, 0.35);
      }
      .fl {
        position: absolute;
        width: 150px;
        height: 150px;
      }
      .fl.a {
        top: -48px;
        left: -48px;
      }
      .fl.b {
        bottom: -48px;
        right: -48px;
        transform: rotate(36deg);
      }
      #cover,
      #hero {
        position: relative;
        overflow: hidden;
      }
      #cover {
        position: fixed;
      }
      .fl2 {
        width: 64px;
        height: 64px;
        display: block;
        margin: 0 auto 14px;
      }
      /* cover */
      #cover {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: linear-gradient(170deg, #fff6f8, var(--sage));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        transition: transform 0.9s ease;
      }
      #cover.open {
        transform: translateY(-100%);
      }
      #cover .arch {
        width: 100%;
        max-width: 340px;
      }
      #cover small {
        display: block;
        font-size: 13px;
        margin-bottom: 10px;
      }
      #cover h1 {
        font:
          700 44px/1 "Cormorant Garamond",
          serif;
        margin: 0 0 22px;
      }
      .guest {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 10px;
        padding: 12px;
        margin: 18px 0 22px;
      }
      .guest b {
        display: block;
        font-size: 19px;
      }
      .btn {
        display: inline-block;
        border: 0;
        background: var(--ink);
        color: #fff;
        font: 600 15px "Plus Jakarta Sans";
        padding: 12px 26px;
        border-radius: 99px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn.line {
        background: none;
        color: var(--ink);
        border: 1px solid var(--ink);
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      /* hero */
      #hero {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #hero h1 {
        font:
          700 clamp(52px, 16vw, 76px)/0.95 "Cormorant Garamond",
          serif;
        margin: 14px 0;
      }
      #hero .amp {
        font:
          italic 500 30px "Cormorant Garamond",
          serif;
      }
      /* countdown */
      .cd {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 22px;
      }
      .cd div {
        background: var(--sage);
        border-radius: 10px;
        padding: 12px 0;
      }
      .cd b {
        display: block;
        font:
          700 28px/1 "Cormorant Garamond",
          serif;
      }
      .cd span {
        font-size: 12px;
        color: var(--muted);
      }
      /* couple */
      .person {
        margin-bottom: 36px;
      }
      .photo {
        width: 170px;
        height: 170px;
        margin: 0 auto 14px;
        border-radius: 50%;
        border: 3px solid var(--white);
        box-shadow: 0 0 0 1px var(--sage2);
        background: linear-gradient(160deg, var(--sage2), var(--sage));
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 44px "Cormorant Garamond",
          serif;
      }
      .person h3 {
        font:
          700 28px/1.1 "Cormorant Garamond",
          serif;
        margin: 0;
      }
      /* events */
      .band {
        background: var(--sage);
        max-width: none;
      }
      .band > div {
        max-width: 520px;
        margin: 0 auto;
      }
      .ev {
        background: var(--white);
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 16px;
      }
      .ev h3 {
        font:
          700 26px "Cormorant Garamond",
          serif;
        margin: 0 0 6px;
      }
      /* gallery */
      .gal {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .gal div {
        aspect-ratio: 3/4;
        border-radius: 10px;
        background: linear-gradient(160deg, var(--sage2), var(--sage));
      }
      .gal div:nth-child(3n) {
        grid-column: span 2;
        aspect-ratio: 16/9;
      }
      /* forms */
      label {
        display: block;
        text-align: left;
        font-size: 14px;
        font-weight: 500;
        margin: 14px 0 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
        padding: 11px 12px;
        border: 1px solid var(--sage2);
        border-radius: 10px;
        background: var(--white);
        color: var(--ink);
      }
      .bank {
        background: var(--white);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 14px;
      }
      .bank b {
        font-size: 20px;
        letter-spacing: 0.04em;
        display: block;
      }
      footer {
        padding: 48px 24px;
        color: var(--muted);
        font-size: 14px;
      }
      /* music */
      #music {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 0;
        background: var(--ink);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: none;
      }
      #music.on {
        animation: spin 6s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #music.on {
          animation: none;
        }
        #cover {
          transition: none;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body class="lock">
    <div id="cover">
      <svg class="fl a" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="#E7A9B8" opacity=".85">
          <ellipse cx="50" cy="22" rx="12" ry="20" />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(72 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(144 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(216 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(288 50 50)"
          />
        </g>
        <circle cx="50" cy="50" r="9" fill="#D9A441" /></svg
      ><svg class="fl b" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="#E7A9B8" opacity=".85">
          <ellipse cx="50" cy="22" rx="12" ry="20" />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(72 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(144 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(216 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(288 50 50)"
          />
        </g>
        <circle cx="50" cy="50" r="9" fill="#D9A441" />
      </svg>
      <div class="arch">
        <small>Undangan Pernikahan</small>
        <h1 id="cNames"></h1>
        <div class="guest">
          <small class="muted">Kepada Yth.</small
          ><b id="guest">Tamu Undangan</b>
        </div>
        <button class="btn" id="openBtn">Buka Undangan</button>
      </div>
    </div>

    <button id="music" aria-label="Putar atau jeda musik">♪</button>
    <audio id="audio" loop></audio>

    <section id="hero">
      <svg class="fl2" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="#E7A9B8" opacity=".85">
          <ellipse cx="50" cy="22" rx="12" ry="20" />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(72 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(144 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(216 50 50)"
          />
          <ellipse
            cx="50"
            cy="22"
            rx="12"
            ry="20"
            transform="rotate(288 50 50)"
          />
        </g>
        <circle cx="50" cy="50" r="9" fill="#D9A441" />
      </svg>
      <p class="muted">Kami akan menikah</p>
      <h1 id="hNames"></h1>
      <p id="hDate"></p>
      <div class="cd" id="cd" aria-label="Hitung mundur"></div>
    </section>

    <section>
      <h2>Bismillahirrahmanirrahim</h2>
      <p class="muted" id="pembuka"></p>
    </section>

    <section id="couple"></section>

    <section class="band">
      <div>
        <h2>Acara</h2>
        <div id="events"></div>
        <p id="loc"></p>
        <a class="btn line" id="mapBtn" target="_blank" rel="noopener"
          >Buka peta lokasi</a
        >
      </div>
    </section>

    <section>
      <h2>Galeri</h2>
      <div class="gal" id="gal"></div>
    </section>

    <section class="band">
      <div>
        <h2>Konfirmasi kehadiran</h2>
        <label for="rn">Nama</label><input id="rn" />
        <label for="rj">Jumlah tamu</label>
        <select id="rj">
          <option>1 orang</option>
          <option>2 orang</option>
          <option>3 orang</option>
          <option>4 orang</option>
        </select>
        <label for="rs">Kehadiran</label>
        <select id="rs">
          <option>Hadir</option>
          <option>Tidak hadir</option>
        </select>
        <label for="rp">Ucapan</label><textarea id="rp" rows="3"></textarea>
        <p style="margin-top: 18px">
          <button class="btn" id="rsvp">Kirim lewat WhatsApp</button>
        </p>
      </div>
    </section>

    <section id="bankSec">
      <h2>Amplop digital</h2>
      <p class="muted">
        Doa restu Anda sudah sangat berarti. Bila ingin memberi tanda kasih,
        dapat melalui:
      </p>
      <div id="banks"></div>
    </section>

    <footer>
      <p class="serif" style="font-size: 26px; color: var(--ink)">
        Terima kasih
      </p>
      <p id="fNames"></p>
    </footer>

    <script>
      window.DEFAULT_ID = "dimas-ayu";
    </script>
    <script src="../../assets/undangan.js"></script>
  </body>
</html>
